name: Deploy

# Only from the default branch, plus a manual run — so feature branches never
# publish. Enable Pages first: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # overwrite: true on the artifact upload deletes the previous artifact first,
  # which needs write access to the Actions API.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Inlined from actions/upload-pages-artifact@v3 so the upload can pass
      # overwrite: true. Re-running the build job leaves the earlier upload in
      # place, and deploy-pages fails when it finds two "github-pages"
      # artifacts in one run.
      - name: Archive dist for Pages
        run: |
          tar --dereference --hard-dereference \
            --directory dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
