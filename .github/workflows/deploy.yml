name: Deploy

# Pages publishes only from main, and only for a commit whose CI workflow
# has already succeeded. This file's workflow_run trigger is read from the
# default branch, so pull requests never deploy.
#
# A manual run (workflow_dispatch) republishes main, and it also refuses to
# upload unless this commit has a successful CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # overwrite: true on the artifact upload deletes the previous artifact first,
  # which needs write access to the Actions API. The same permission lets a
  # manual run look up the CI result for this commit.
  actions: write

# A CI completion always starts this workflow; the job below no-ops unless
# this commit should actually publish. cancel-in-progress is true only in
# that case, so a failed or outdated CI run cannot abort a newer upload.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha) }}

jobs:
  pages:
    # head_sha == github.sha skips an older main commit whose CI finished
    # after a newer commit was already pushed, so a slow run cannot roll
    # the site back. github.sha on workflow_run is the tip of the default branch.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require a successful CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].conclusion // empty')"
          if [ "$conclusion" != "success" ]; then
            echo "CI has not succeeded for ${GITHUB_SHA}; refusing to deploy."
            exit 1
          fi
          echo "CI succeeded for ${GITHUB_SHA}."
      - run: npm run build
      # Inlined from actions/upload-pages-artifact@v3 so the upload can pass
      # overwrite: true. Re-running the build job leaves the earlier upload in
      # place, and deploy-pages fails when it finds two "github-pages"
      # artifacts in one run.
      - name: Archive dist for Pages
        run: |
          tar --dereference --hard-dereference \
            --directory dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
