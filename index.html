<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2c483d" />
    <meta name="description" content="Interactive baseball field for teaching and learning situational baseball." />
    <!-- Added to the home screen, the app runs full screen with the status bar
         drawn over the field; .app pads for it with env(safe-area-inset-top).
         Pinch zoom stays available for text. The field opts out on its own
         with touch-action: none, so a finger there does not pan or zoom the page. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diamondboard" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diamondboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
